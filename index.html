<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RetroToons TV</title>

  <!-- ============================================================ -->
  <!-- CONFIGURACIÓN PWA COMPLETA (TODO INTEGRADO)                  -->
  <!-- ============================================================ -->
  <meta name="theme-color" content="#210947">

  <!-- Configuración Específica para iOS (iPhone / iPad) -->
  <link rel="apple-touch-icon" href="/icon.png">
  <link rel="apple-touch-icon" sizes="152x152" href="/icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icon.png">
  <link rel="apple-touch-icon" sizes="167x167" href="/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RetroToons">

  <!-- Manifest PWA Inyectado en línea (Sin necesidad de manifest.json externo) -->
  <link rel="manifest" href='data:application/json,{
    "name": "RetroToons TV",
    "short_name": "RetroToons",
    "start_url": "/",
    "display": "standalone",
    "background_color": "#210947",
    "theme_color": "#210947",
    "icons": [
      { "src": "/icon.png", "sizes": "180x180", "type": "image/png" },
      { "src": "/icon.png", "sizes": "192x192", "type": "image/png" },
      { "src": "/icon.png", "sizes": "512x512", "type": "image/png" }
    ]
  }'>
  <!-- ============================================================ -->

  <style>
    :root{
      --violeta:#321064;
      --amarillo:#ffd52d;
      --texto:#f9f6ff;
      --suave:#bbadd4;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      min-height:100%;
      background:#210947;
      color:var(--texto);
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      background:
        radial-gradient(circle at 82% 0,#7542b3 0,transparent 27%),
        linear-gradient(125deg,#1c093d,#3e1378 55%,#24074b);
    }

    .app{
      min-height:100vh;
      padding:22px 3.6vw;
    }

    .top{
      height:58px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:18px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:11px;
      font-size:24px;
      font-weight:900;
      letter-spacing:.5px;
    }

    .brand b{color:var(--amarillo)}

    .mark{
      display:grid;
      place-items:center;
      background:var(--amarillo);
      color:var(--violeta);
      height:52px;
      width:52px;
      border-radius:13px;
      font-size:35px;
      font-style:italic;
    }

    .clock{text-align:right}

    .clock strong{
      display:block;
      font-size:27px;
      line-height:1;
    }

    .clock small{
      color:var(--suave);
      font-size:11px;
      text-transform:capitalize;
    }

    .layout{
      display:grid;
      grid-template-columns:minmax(260px,22%) 1fr;
      gap:28px;
    }

    .head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      margin-bottom:14px;
    }

    .head h1{
      margin:0;
      font-size:15px;
      letter-spacing:1.8px;
    }

    .head span{
      color:var(--amarillo);
      font-size:10px;
      font-weight:bold;
    }

    .channels{
      max-height:calc(100vh - 155px);
      overflow:auto;
      padding-right:4px;
    }

    .channel{
      display:grid;
      grid-template-columns:27px 40px 1fr 18px;
      align-items:center;
      gap:9px;
      width:100%;
      margin:4px 0;
      padding:9px 10px;
      border:1px solid transparent;
      border-radius:10px;
      background:transparent;
      color:#fff;
      cursor:pointer;
      text-align:left;
    }

    .channel:hover,
    .channel:focus,
    .channel.focused{
      background:#4d208d;
      outline:2px solid var(--amarillo);
      outline-offset:-2px;
    }

    .channel.active{
      background:linear-gradient(90deg,#ffdc3d,#f6b90d);
      box-shadow:0 5px 13px #12032c77;
      color:#26084e;
      font-weight:bold;
    }

    .channel.active.focused{outline-color:#fff}

    .num{
      font-size:10px;
      font-weight:bold;
      opacity:.72;
    }

    .logo{
      display:grid;
      place-items:center;
      height:32px;
      border-radius:7px;
      background:#7d52b3;
      color:#fff;
      font-size:10px;
      font-weight:900;
    }

    .active .logo{background:#4b1687}

    .name{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
      font-size:15px;
    }

    .play{visibility:hidden}
    .active .play{visibility:visible}

    .hint{
      color:#a99abe;
      font-size:10px;
      line-height:1.6;
      margin:16px 4px;
    }

    .playerwrap{
      position:relative;
      aspect-ratio:16/9;
      overflow:hidden;
      background:#10051e;
      border:2px solid #8051b6;
      border-radius:16px;
      box-shadow:0 19px 40px #16032c73;
    }

    .player,
    .player iframe,
    .player video{
      width:100%;
      height:100%;
      border:0;
      background:#000;
    }

    .loading{
      display:flex;
      align-items:center;
      justify-content:center;
      height:100%;
      color:var(--suave);
    }

    .fullscreen{
      position:absolute;
      right:14px;
      bottom:14px;
      width:47px;
      height:42px;
      border:0px solid #8c68b8;
      border-radius:1px;
      background:transparent;
      color:#fff;
      font-size:23px;
      cursor:pointer;
    }

    .playerwrap:fullscreen{
      width:100vw;
      height:100vh;
      border:0;
      border-radius:0;
    }

    .now{
      display:flex;
      align-items:center;
      gap:14px;
      margin:18px 5px;
    }

    .live{
      padding:7px 11px;
      border-radius:20px;
      background:#e93860;
      font-size:11px;
      font-weight:bold;
    }

    .live i{
      display:inline-block;
      width:6px;
      height:6px;
      margin-right:5px;
      border-radius:50%;
      background:#fff;
    }

    .eyebrow{
      margin:0 0 3px;
      color:var(--amarillo);
      font-size:10px;
      font-weight:bold;
      letter-spacing:1.2px;
    }

    .now h2{
      margin:0;
      font-size:25px;
    }

    .fav{
      margin-left:auto;
      border:0;
      background:transparent;
      color:var(--amarillo);
      font-size:35px;
      cursor:pointer;
    }

    .tip{
      padding:12px 14px;
      border-left:3px solid var(--amarillo);
      border-radius:5px;
      background:#29104f;
      color:#d3c8e1;
      font-size:13px;
    }

    @media(max-width:760px){
      .app{padding:16px}
      .top{height:48px}
      .brand{font-size:18px}
      .mark{width:42px;height:42px;font-size:25px}
      .clock strong{font-size:20px}
      .layout{display:block}
      .side{margin-bottom:20px}

      .channels{
        display:flex;
        gap:7px;
        max-height:none;
        overflow:auto;
      }

      .channel{
        flex:0 0 170px;
        grid-template-columns:26px 38px 1fr;
      }

      .play,.hint{display:none}
      .now h2{font-size:20px}
      .tip{font-size:11px}
    }
  </style>
</head>

<body>

    <header class="top">
      <div class="brand">
        <span class="mark">R</span>

          <b>Apoya el Proyecto:</b>
          Si quieres ayudar con este proyecto, dona un cafecito. 
          <span style="color: #C4A900;"><b>Cafecito.app/retrotoons2026</b></span>
        </div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>

  <script>

        `;
        const blob = new Blob([swCode], { type: 'text/javascript' });
        const swUrl = URL.createObjectURL(blob);
        
        navigator.serviceWorker.register(swUrl)
          .then(() => console.log('PWA Service Worker listo'))
          .catch(err => console.log('Error SW:', err));
      });
    }

      },
      {
        id: "zyoontv",
        name: "Zyoon TV",
        short: "ZTV",
        stream: "https://live20.bozztv.com/giatv/giatv-ZYOONTV/ZYOONTV/chunks.m3u8"
      }
    ];

    const kickIndex = channels.findIndex(ch => ch.id === "retrotoons-kick");
    let current = kickIndex !== -1 ? kickIndex : 0;
    let cursor = current;
    let hlsInstance = null;

    const favorites = new Set(
      JSON.parse(localStorage.getItem("retrotoons-favorites") || "[]")
    );

    const $ = selector => document.querySelector(selector);

    function render() {
      const list = $("#list");
      list.innerHTML = "";

      channels.forEach((channel, index) => {
        const button = document.createElement("button");

        button.dataset.index = index;
        button.className =
          "channel " +
          (index === current ? "active " : "") +
          (index === cursor ? "focused" : "");

        button.innerHTML = `
          <span class="num">${String(index + 1).padStart(2, "0")}</span>
          <span class="logo">${channel.short}</span>
          <span class="name">${channel.name}</span>
          <span class="play">▶</span>
        `;

        button.onclick = () => selectChannel(index);
        list.appendChild(button);
      });
    }

    function selectChannel(index) {
      const channel = channels[index];
      if (!channel) return;

      current = index;
      cursor = index;

      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }

      let media;

      if (channel.stream) {
        media = document.createElement("video");
        media.controls = true;
        media.autoplay = true;
        media.muted = false;
        media.defaultMuted = false;
        media.playsInline = true;
        media.setAttribute("playsinline", "");

        if (window.Hls && Hls.isSupported()) {
          hlsInstance = new Hls();
          hlsInstance.loadSource(channel.stream);
          hlsInstance.attachMedia(media);

          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            media.muted = false;
            media.play().catch(() => {
              media.muted = true;
              media.play().catch(() => {});
            });
          });
        } else {
          media.src = channel.stream;
          media.muted = false;

          media.oncanplay = () => {
            media.muted = false;
            media.play().catch(() => {
              media.muted = true;
              media.play().catch(() => {});
            });
          };
        }
      } else {
        const url = new URL(channel.embed);
        url.searchParams.set("autoplay", "1");
        url.searchParams.set("mute", "0");

        media = document.createElement("iframe");
        media.src = url.href;
        media.allow = "autoplay; fullscreen; picture-in-picture";
        media.allowFullscreen = true;
      }

      media.title = channel.name;

      $("#player").replaceChildren(media);
      $("#title").textContent = channel.name;
      $("#fav").textContent = favorites.has(channel.id) ? "★" : "☆";

      render();
    }

    function moveCursor(amount) {
      cursor = (cursor + amount + channels.length) % channels.length;
      render();

      document
        .querySelector(`[data-index="${cursor}"]`)
        ?.focus();
    }

    function toggleFullscreen() {
      if (document.fullscreenElement) {
        document.exitFullscreen();
      } else {
        $("#playerWrap").requestFullscreen();
      }
    }

    $("#count").textContent = channels.length + " CANALES";

    $("#full").onclick = toggleFullscreen;

    $("#fav").onclick = () => {
      const channel = channels[current];

      if (favorites.has(channel.id)) {
        favorites.delete(channel.id);
      } else {
        favorites.add(channel.id);
      }

      localStorage.setItem(
        "retrotoons-favorites",
        JSON.stringify([...favorites])
      );

      selectChannel(current);
    };

    document.onkeydown = event => {
      if (event.key === "ArrowDown") {
        event.preventDefault();
        moveCursor(1);
      }

      if (event.key === "ArrowUp") {
        event.preventDefault();
        moveCursor(-1);
      }

      if (event.key === "ArrowRight") {
        event.preventDefault();
        $("#playerWrap").focus();
      }

      if (
        event.key === "ArrowLeft" &&
        document.activeElement === $("#playerWrap")
      ) {
        event.preventDefault();

        document
          .querySelector(`[data-index="${cursor}"]`)
          ?.focus();
      }

      if (event.key === "Enter") {
        event.preventDefault();

        if (document.activeElement === $("#playerWrap")) {
          toggleFullscreen();
        } else {
          selectChannel(cursor);
        }
      }

      if (event.key.toLowerCase() === "f") {
        toggleFullscreen();
      }

      if (event.key === "Escape" && document.fullscreenElement) {
        document.exitFullscreen();
      }
    };

    function updateClock() {
      const now = new Date();

      $("#clock").textContent = now.toLocaleTimeString("es-AR", {
        hour: "2-digit",
        minute: "2-digit"
      });

      $("#date").textContent = now.toLocaleDateString("es-AR", {
        weekday: "long",
        day: "numeric",
        month: "short"
      });
    }

    updateClock();
    setInterval(updateClock, 1000);

    render();
    selectChannel(current);
  </script>
</body>
</html>
